name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Frontend governance, backend quality, tests, and coverage gates
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: FSD structure (steiger)
        run: pnpm check:fsd
      - name: CSS color governance (stylelint)
        run: pnpm check:style
      - name: Unit tests + coverage gate (vitest)
        run: pnpm test:coverage
      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Rust lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: Rust unit tests + core coverage gate
        run: pnpm test:rust:coverage
      - name: Typecheck + build
        run: pnpm build

  # Catalog load benchmark — fails the pipeline on perf regression
  perf:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Checkout content data
        uses: actions/checkout@v7
        with:
          repository: Nghiathan13/ownlish-data
          path: ownlish-data
      - name: Install Linux system dependencies (Tauri 2 + Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf \
            build-essential \
            pkg-config \
            xvfb
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Benchmark catalog load
        run: xvfb-run -a node scripts/bench-catalog.mjs ownlish-data/catalog.json
      - name: Benchmark 7-part preload
        run: xvfb-run -a node scripts/bench-parts.mjs ownlish-data
      - name: Update baselines (main pushes only, on pass)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          xvfb-run -a node scripts/bench-catalog.mjs ownlish-data/catalog.json --update-baseline
          xvfb-run -a node scripts/bench-parts.mjs ownlish-data --update-baseline
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/perf-baseline.json .github/perf-baseline-parts.json
          git diff --cached --quiet || {
            git commit -m "ci: update perf baselines [skip ci]"
            git push
          }

  # Deploy gate — only runs when checks AND perf pass (push events only)
  deploy:
    needs: [checks, perf]
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux system dependencies (Tauri 2)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf \
            build-essential \
            pkg-config
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build release bundle
        run: pnpm tauri build
      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: ownlish-linux
          path: src-tauri/target/release/bundle/
          if-no-files-found: error
